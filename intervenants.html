<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intervenants</title>
    <link rel="stylesheet" href="css/intervenants.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-logo">
            <h3>YouCode <span>Events</span></h3>
        </div>
        
        <nav class="nav-menu hidden">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="evenements.html">Événements</a></li>
                <li><a class="current-page" href="intervenants.html">Intervenants</a></li>
                <div>
                    <a href="#" class="btn-nav">S'inscrire</a>
                </div>
            </ul>
        </nav>

        <div class="header-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>
    <main>
        <section class="hero-section">
            <h1>Inscription</h1>
            <p>Réservez votre place à un atelier, une conférence, un hackathon ou une rencontre. L'inscription est gratuite.</p>
        </section>
    </main>


    







    <script>
        let menu_icon = document.querySelector(".header-icon");
        let navMenu = document.querySelector(".nav-menu");
        let icon = menu_icon.querySelector("i");
        let main = document.querySelector("main")
        menu_icon.addEventListener("click", () => {
            navMenu.classList.toggle("hidden");
            if (navMenu.classList.contains("hidden")) {
                icon.classList.remove("fa-xmark");
                icon.classList.add("fa-bars");
                main.style.display ="block";
            } else {
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-xmark");
                main.style.display ="none"
            }
        });
    </script>
</body>
</html>
